name: Back CI

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - 'back/**'
      - '.github/workflows/back-ci.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          

      - name: Compute image name & tags
        id: meta
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO_LC}/back" >> "$GITHUB_OUTPUT"
          echo "tags=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Docker image with Jib (GHCR)
        if: github.event_name == 'push'
        run: |
          # Debug flags for Jib/Maven output
          MAVEN_OPTS="-Djib.console=plain -Dorg.slf4j.simpleLogger.log.com.google.cloud.tools.jib=debug"
          mvn -B -ntp -DskipTests \
            -Djib.to.image=${{ steps.meta.outputs.image }} \
            -Djib.to.tags=${{ steps.meta.outputs.tags }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            jib:build -X

      - name: Build & Test with Maven
        run: mvn -B -ntp clean verify